# Manual release: checks, packs and verifies @wrpguard/core and @wrpguard/cli, then publishes them
# to npm with provenance through trusted publishing (OIDC, no token, no 2FA prompt). With
# stage=true it uses `npm stage publish` instead, and a maintainer approves each package with 2FA.
# Starts only by hand (Actions tab or `gh workflow run`), and is a dry run unless dry_run is set
# to false. See docs/RELEASING.md.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (check, pack and verify; do not publish)
        type: boolean
        default: true
      stage:
        description: Stage instead of publishing (approve each package with 2FA on npmjs.com)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/pack-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/*.tgz
            release/*.cdx.json
            release/SHA256SUMS
          if-no-files-found: error
      - name: Publish to npm
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          STAGE: ${{ inputs.stage }}
          # Trusted publishing needs no token. NPM_TOKEN is only a fallback for stage=true and
          # can be deleted once trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          # A prerelease goes to `next` only once a stable version holds `latest`; until then it
          # becomes `latest`, so the npm page and a plain `npm i` show the newest release.
          current=$(npm view @wrpguard/core dist-tags.latest 2>/dev/null || true)
          tag=latest
          case "$version" in *-*) case "$current" in '' | *-*) ;; *) tag=next ;; esac ;; esac
          flags=(--access public --provenance --tag "$tag")
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          publish=(npm publish)
          if [ "$STAGE" = "true" ]; then publish=(npm stage publish); fi
          for name in core cli; do
            "${publish[@]}" "./release/wrpguard-$name-$version.tgz" "${flags[@]}"
          done
