# Manual release: checks, packs and verifies @wrpguard/core and @wrpguard/cli, then stages them
# on npm with provenance (`npm stage publish`); a maintainer approves each staged package with
# 2FA before it goes live. Starts only by hand (Actions tab or `gh workflow run`), and is a dry
# run unless dry_run is set to false. See docs/RELEASING.md.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (check, pack and verify; do not publish)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/pack-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/*.tgz
            release/*.cdx.json
            release/SHA256SUMS
          if-no-files-found: error
      - name: Stage on npm (a maintainer approves with 2FA)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # A granular token without 2FA bypass can stage; with trusted publishing (OIDC)
          # configured, leave the secret unset.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          flags=(--access public --provenance --tag "$tag")
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          for name in core cli; do
            npm stage publish "./release/wrpguard-$name-$version.tgz" "${flags[@]}"
          done
