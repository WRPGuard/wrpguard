# Publishes @wrpguard/core and @wrpguard/cli to npm with provenance through trusted publishing
# (OIDC: no token, no 2FA prompt). See docs/RELEASING.md.
#
# Automatic: a push to main releases the current package version when its CHANGELOG heading is
# dated ("## 1.2.3 (YYYY-MM-DD)") and that version is not on npm yet. While the heading says
# "(unreleased)", pushes never publish.
# Manual: Actions tab or `gh workflow run release.yml`; a dry run unless dry_run=false, and
# stage=true stages instead (a maintainer approves each package with 2FA on npmjs.com).
name: release

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - packages/core/package.json
      - packages/cli/package.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (check, pack and verify; do not publish)
        type: boolean
        default: true
      stage:
        description: Stage instead of publishing (approve each package with 2FA on npmjs.com)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether to release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/release-plan.mjs

  release:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/pack-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/*.tgz
            release/*.cdx.json
            release/SHA256SUMS
          if-no-files-found: error
      - name: Publish to npm
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          STAGE: ${{ inputs.stage }}
          # Trusted publishing needs no token. NPM_TOKEN is only a fallback for stage=true and
          # can be deleted once trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          # A prerelease goes to `next` only once a stable version holds `latest`; until then it
          # becomes `latest`, so the npm page and a plain `npm i` show the newest release.
          current=$(npm view @wrpguard/core dist-tags.latest 2>/dev/null || true)
          tag=latest
          case "$version" in *-*) case "$current" in '' | *-*) ;; *) tag=next ;; esac ;; esac
          flags=(--access public --provenance --tag "$tag")
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          publish=(npm publish)
          if [ "$STAGE" = "true" ]; then publish=(npm stage publish); fi
          for name in core cli; do
            "${publish[@]}" "./release/wrpguard-$name-$version.tgz" "${flags[@]}"
          done
          if [ "$DRY_RUN" != "true" ] && [ "$STAGE" != "true" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  # After a real publish (not a dry run, not staged): tag the commit and attach the published
  # tarballs, SBOM and checksums to a GitHub release. Release notes come from CHANGELOG.md.
  github-release:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          awk -v heading="## $version " 'index($0, heading) == 1 { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$version" release/* --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md "${prerelease[@]}"
